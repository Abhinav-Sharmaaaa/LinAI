[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linai"
version = "0.2.0"
description = "Lightweight cross-platform AI terminal assistant with TUI, workflows, and web search"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhinav Sharma", email = "abhinav@example.com"}]
keywords = ["ai", "terminal", "tui", "assistant", "openrouter", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
linai = "linai.cli:main"

[project.urls]
Homepage = "https://github.com/Abhinav-Sharmaaaa/LinAI"
Repository = "https://github.com/Abhinav-Sharmaaaa/LinAI"
Issues = "https://github.com/Abhinav-Sharmaaaa/LinAI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["linai*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"